name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            APP_NAME="androxinev2-webapp"

            cd "${{ secrets.DEPLOY_PATH }}" || exit 1

            if [ ! -d ".git" ]; then
              echo "Repository not initialized. Initializing..."
              git init
              git remote add origin https://github.com/${{ github.repository }}
            fi

            git fetch origin
            git reset --hard origin/master

            # ---------- ENV BACKUP ----------
            if [ -f ".env" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              cp .env ".env.backup_$timestamp"
            fi

            echo "${{ secrets.ENV }}" > .env

            ls -1t .env.backup_* 2>/dev/null | tail -n +6 | xargs -r rm --

            # Диагностика окружения в non-interactive SSH shell
            node --version
            npm --version
            which node
            which npm

            # Для pnpm-проектов используем lockfile, иначе fallback на npm
            if [ -f "pnpm-lock.yaml" ]; then
              corepack enable
              pnpm --version
              pnpm install --frozen-lockfile
              pnpm build
              pnpm prune --prod
            elif [ -f "package-lock.json" ]; then
              npm ci
              npm run build
              npm prune --omit=dev
            else
              npm install
              npm run build
              npm prune --omit=dev
            fi

            # Next.js нужно не только собрать, но и запустить runtime-процесс
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 is not installed on the server. Install it: npm i -g pm2"
              exit 1
            fi

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start npm --name "$APP_NAME" -- start
            fi

            pm2 save
            
          EOF
